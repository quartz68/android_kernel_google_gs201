name: Rebase with latest changes from AOSP

on:
  schedule:
    - cron: '0 3 * * 1,4'
  workflow_dispatch:

jobs:
  rebase:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Set up Git config
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
    - name: Add upstream and fetch
      run: |
        git remote add upstream https://android.googlesource.com/platform/manifest || true
        git fetch upstream
    - name: Rebase from latest -> main
      id: rebase
      run: |
        git checkout -b upstream-sync origin/${{ github.ref_name }}
        git rebase upstream/android-latest-release || true
        SKIPPED_COMMITS=""
        while [ -d ".git/rebase-merge" ] || [ -d ".git/rebase-apply" ]; do
          if git status --porcelain | grep -q "^UU\|^AA\|^DD"; then
            # There are merge conflicts, skip this commit
            CONFLICT_COMMIT=$(git log --oneline -1 --pretty=format:"%h %s")
            echo "Skipping conflict commit: $CONFLICT_COMMIT"
            SKIPPED_COMMITS+="$CONFLICT_COMMIT\n"
            git rebase --skip || break
          else
            # Try to continue the rebase
            git rebase --continue || break
          fi
        done
        echo "skipped_conflicts<<EOF" >> $GITHUB_OUTPUT
        echo -e "$SKIPPED_COMMITS" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
    - name: Check if there are any changes
      id: diffcheck
      run: |
        git fetch origin ${{ github.ref_name }}
        git diff --stat origin/${{ github.ref_name }} > diff.txt
        echo "diff_output<<EOF" >> $GITHUB_OUTPUT
        cat diff.txt >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        if [ ! -s diff.txt ]; then
          echo "No changes after rebase, skipping..."
          exit 0
        fi
    - name: Create pull request
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        branch: rebased/aosp-latest
        title: "Rebase: AOSP Upstream (automated)"
        body: |
          This PR rebases `${{ github.ref_name }}` onto the latest AOSP `android-latest-release`.
          **Skipped Conflicting Commits (manual review recommended):**
          ```
          ${{ steps.rebase.outputs.skipped_conflicts }}
          ```
        base: ${{ github.ref_name }}
        delete-branch: true
